<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debatle - Start Your Debate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./moggle.css">
</head>
<body>
    <main class="page-shell">
        <section class="hero-card">
            <h3>Can&apos;t find an interesting take?</h3>
            <h1>Start Your Own Debate</h1>
            <p id="homePresence" aria-live="polite">0 people are online right now</p>
            <form id="takeForm" class="take-form">
                <div class="form-group">
                    <label for="authorText">Your Name</label>
                    <input id="authorText" type="text" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="takeText">Debate Topic</label>
                    <input id="takeText" type="text" placeholder="What should we debate about?" required>
                </div>
                <div class="take-actions">
                    <button id="submitTake" type="submit">Create Debate</button>
                    <button id="reloadTakes" class="take-reload-button" type="button">Reload</button>
                </div>
                <p id="statusMessage" aria-live="polite"></p>
            </form>
        </section>
        <section>
            <div class="form-group topic-browser">
                <label for="topicSearch">Search Debate Topics</label>
                <input id="topicSearch" type="text" placeholder="Search all topics..." autocomplete="off">
                <p id="topicBrowseMeta" class="take-meta topic-browse-meta">Showing 5 random topics.</p>
            </div>
            <div id="takeParent"></div>
        </section>
    </main>

    <!-- Modal for confirming debate join (name + stance) -->
    <div id="debateModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;z-index:9999;">
        <div class="debate-modal-card">
            <h3 id="modalTopic" class="debate-modal-title">Confirm Debate</h3>
            <div class="debate-modal-field">
                <label for="modalName">Your name</label>
                <input id="modalName" class="debate-modal-input" type="text" />
            </div>
            <div class="debate-modal-field">
                <label for="modalStance">Your stance</label>
                <select id="modalStance" class="debate-modal-input">
                    <option value="" disabled selected>Pick a side</option>
                    <option value="agree">Agree</option>
                    <option value="disagree">Disagree</option>
                </select>
            </div>
            <div class="debate-modal-actions">
                <button id="modalCancel" class="debate-modal-secondary" type="button">Cancel</button>
                <button id="modalConfirm" class="debate-modal-primary" type="button">Join Debate</button>
            </div>
        </div>
    </div>

</body>
<script src="./supabase-config.js"></script>
<script>
    const SUPABASE_TABLE = "debate_topics";
    const SUPABASE_TABLE_PRESENCE = "debate_topic_presence";
    const HOME_TOPIC_KEY = "__lobby__";
    const SUPABASE_ENV = window.SUPABASE_ENV || {};

    var takeForm = document.getElementById("takeForm");
    
    var takeParent = document.getElementById("takeParent");
    var takeTextInput = document.getElementById("takeText");
    var authorTextInput = document.getElementById("authorText");
    var statusMessage = document.getElementById("statusMessage");
    var homePresence = document.getElementById("homePresence");
    var topicSearchInput = document.getElementById("topicSearch");
    var topicBrowseMeta = document.getElementById("topicBrowseMeta");

    var takeList = [];
    var allTopicRows = [];
    var displayedTopicRows = [];
    var TOPIC_SAMPLE_LIMIT = 5;
    var supabaseUrl = "";
    var supabaseAnonKey = "";
    var configLoaded = false;
    var homeSessionId = getHomeSessionId();
    var homePresenceHeartbeatId = null;
    var homePresenceRefreshId = null;
    var visibleTopicPresenceRefreshId = null;

    function parseEnvFile(envText) {
        return envText.split(/\r?\n/).reduce(function (config, line) {
            var trimmedLine = line.trim();

            if (!trimmedLine || trimmedLine.startsWith("#")) {
                return config;
            }

            var separatorIndex = trimmedLine.indexOf("=");

            if (separatorIndex === -1) {
                return config;
            }

            var key = trimmedLine.slice(0, separatorIndex).trim();
            var value = trimmedLine.slice(separatorIndex + 1).trim();
            config[key] = value.replace(/^['\"]|['\"]$/g, "");
            return config;
        }, {});
    }

    async function loadSupabaseConfig() {
        var envConfig = SUPABASE_ENV;
        supabaseUrl = envConfig.SUPABASE_URL || envConfig.NEXT_PUBLIC_SUPABASE_URL || "";
        supabaseAnonKey = envConfig.SUPABASE_ANON_KEY || envConfig.NEXT_PUBLIC_SUPABASE_ANON_KEY || "";

        if (!supabaseUrl || !supabaseAnonKey) {
            throw new Error("Supabase config is missing from supabase-config.js.");
        }

        configLoaded = true;
    }

    function resetTopics() {
        takeList = [];
        takeParent.innerHTML = "";
    }

    function setStatus(message) {
        statusMessage.textContent = message;
    }

    function setHomePresence(message) {
        homePresence.textContent = message;
    }

    function getHomeSessionId() {
        var storageKey = "home-debate-session-id";
        var existing = window.sessionStorage.getItem(storageKey);

        if (!existing) {
            existing = (window.crypto && window.crypto.randomUUID)
                ? window.crypto.randomUUID()
                : `home-${Math.random().toString(36).slice(2)}-${Date.now()}`;
            window.sessionStorage.setItem(storageKey, existing);
        }

        return existing;
    }

    function goToDebate(event) {
        // show modal to collect name + stance before opening debate
        const idx = Number(event.currentTarget.dataset.displayIndex);
        const row = displayedTopicRows[idx];
        if (!row || !row.topic) {
            setStatus('Topic not found. Please reload.');
            return;
        }
        const topicText = row.topic;
        showDebateModal(topicText);
    }

    function setCookie(name, value, days) {
        let expires = '';
        if (days) {
            const d = new Date();
            d.setTime(d.getTime() + (days*24*60*60*1000));
            expires = '; expires=' + d.toUTCString();
        }
        document.cookie = name + '=' + encodeURIComponent(value || '') + expires + '; path=/';
    }

    function getCookie(name) {
        const cookieValue = document.cookie.split('; ').find((entry) => entry.startsWith(name + '='));
        return cookieValue ? decodeURIComponent(cookieValue.slice(name.length + 1)) : '';
    }

    // Modal handling
    let pendingTopic = '';
    const debateModal = document.getElementById('debateModal');
    const modalTopic = document.getElementById('modalTopic');
    const modalName = document.getElementById('modalName');
    const modalStance = document.getElementById('modalStance');
    const modalCancel = document.getElementById('modalCancel');
    const modalConfirm = document.getElementById('modalConfirm');

    function showDebateModal(topicText) {
        pendingTopic = topicText;
        modalTopic.textContent = topicText;
        // prefill name from cookie if available
        modalName.value = getCookie('debateName') || authorTextInput.value || '';
        const s = getCookie('debateStance');
        if (s) modalStance.value = s;
        debateModal.style.display = 'flex';
    }

    function hideDebateModal() {
        debateModal.style.display = 'none';
    }

    modalCancel.addEventListener('click', () => {
        hideDebateModal();
    });

    modalConfirm.addEventListener('click', () => {
        const name = modalName.value.trim();
        const stance = modalStance.value;
        if (!name) {
            setStatus('Please enter your name.');
            return;
        }
        if (!stance) {
            setStatus('Please pick a side.');
            return;
        }
        // save cookies
        setCookie('debateName', name, 365);
        setCookie('debateStance', stance, 365);
        // ensure persistent user id so rejoined clients keep "own" messages
        try {
            const existingUid = getCookie('debateUserId');
            if (!existingUid) {
                const newUid = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : `user-${Math.random().toString(36).slice(2)}-${Date.now()}`;
                setCookie('debateUserId', newUid, 3650);
            }
        } catch (e) {
            // ignore cookie failures
        }
        // also keep homepage creator name in sync
        authorTextInput.value = name;
        // store topic and open debate
        setCookie('debateTopic', pendingTopic, 1);
        hideDebateModal();
        window.open('./debate.html', '_blank');
    });

    // reload button behavior
    const reloadBtn = document.getElementById('reloadTakes');
    if (reloadBtn) reloadBtn.addEventListener('click', function(){ loadFromSupabase().catch(function(e){ setStatus(e instanceof Error?e.message:String(e)); }); });

    function shuffleRows(rows) {
        var copy = rows.slice();
        for (var i = copy.length - 1; i > 0; i -= 1) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = copy[i];
            copy[i] = copy[j];
            copy[j] = temp;
        }
        return copy;
    }

    function addPrompt(topicText, authorText, createdAt, displayIndex) {
        let selectButton = document.createElement("button");
        selectButton.type = "button";
        selectButton.dataset.displayIndex = String(displayIndex);
        selectButton.textContent = "Debate Now";
        selectButton.addEventListener("click", goToDebate);

        let takeTextContainer = document.createElement("h3");
        takeTextContainer.textContent = topicText;
        takeTextContainer.style.textAlign = "center";

        let takeMetaContainer = document.createElement("span");
        takeMetaContainer.className = "take-meta take-meta-left";
        takeMetaContainer.textContent = authorText ? `Submitted by ${authorText}${createdAt ? ` on ${new Date(createdAt).toLocaleString()}` : ""}` : "";

        let topicOnlineContainer = document.createElement("span");
        topicOnlineContainer.className = "take-meta topic-online";
        topicOnlineContainer.textContent = "Checking online...";

        let takeMetaRow = document.createElement("div");
        takeMetaRow.className = "take-meta-row";
        takeMetaRow.appendChild(takeMetaContainer);
        takeMetaRow.appendChild(topicOnlineContainer);

        let div = document.createElement("div");
        div.className = "take-box";
        div.dataset.displayIndex = String(displayIndex);
        div.dataset.topic = topicText;
        takeList.push(div);

        takeList[takeList.length - 1].appendChild(takeTextContainer);
        if (takeMetaContainer.textContent || topicOnlineContainer.textContent) {
            takeList[takeList.length - 1].appendChild(takeMetaRow);
        }
        takeList[takeList.length - 1].appendChild(selectButton);

        takeParent.appendChild(takeList[takeList.length - 1]);
    }

    async function fetchTopicOnlineCount(topicText) {
        if (!configLoaded || !topicText) {
            return 0;
        }

        var cutoff = new Date(Date.now() - 30000).toISOString();
        var url = `${supabaseUrl}/rest/v1/${SUPABASE_TABLE_PRESENCE}?select=session_id&topic=eq.${encodeURIComponent(topicText)}&last_seen=gte.${encodeURIComponent(cutoff)}`;
        var response = await fetch(url, {
            method: "GET",
            headers: {
                apikey: supabaseAnonKey,
                Authorization: `Bearer ${supabaseAnonKey}`
            }
        });

        if (!response.ok) {
            throw new Error(await response.text());
        }

        var rows = JSON.parse(await response.text() || "[]");
        return rows.length;
    }

    async function refreshVisibleTopicPresence() {
        if (!displayedTopicRows.length) {
            return;
        }

        var cards = Array.prototype.slice.call(takeParent.querySelectorAll('.take-box[data-display-index]'));
        await Promise.all(cards.map(async function (card) {
            var topicText = card.dataset.topic || '';
            var target = card.querySelector('.topic-online');
            if (!target || !topicText) {
                return;
            }

            try {
                var onlineCount = await fetchTopicOnlineCount(topicText);
                // Ensure this card still represents the same topic after async fetch.
                if (card.dataset.topic !== topicText) {
                    return;
                }
                target.textContent = `${onlineCount} ${onlineCount === 1 ? 'person is' : 'people are'} online in this chat`;
            } catch (error) {
                target.textContent = 'Online count unavailable';
            }
        }));
    }

    function setTopicBrowseMetaText(text) {
        if (topicBrowseMeta) {
            topicBrowseMeta.textContent = text;
        }
    }

    function renderTopicsFromQuery() {
        var query = topicSearchInput ? topicSearchInput.value.trim().toLowerCase() : '';
        var pool = allTopicRows.slice();

        if (query) {
            pool = pool.filter(function (row) {
                return String(row.topic || '').toLowerCase().indexOf(query) !== -1;
            });
        }

        var randomized = shuffleRows(pool);
        displayedTopicRows = randomized.slice(0, TOPIC_SAMPLE_LIMIT);

        resetTopics();
        displayedTopicRows.forEach(function (row, idx) {
            addPrompt(row.topic, row.author, row.created_at, idx);
        });

        if (!allTopicRows.length) {
            setTopicBrowseMetaText('No topics yet. Create one above.');
            return;
        }

        if (!displayedTopicRows.length) {
            setTopicBrowseMetaText(query
                ? `No topics match "${topicSearchInput.value.trim()}".`
                : 'No topics available.');
            return;
        }

        if (query) {
            setTopicBrowseMetaText(`Showing ${displayedTopicRows.length} random match${displayedTopicRows.length === 1 ? '' : 'es'} out of ${pool.length}.`);
        } else {
            setTopicBrowseMetaText(`Showing ${displayedTopicRows.length} random topic${displayedTopicRows.length === 1 ? '' : 's'} out of ${allTopicRows.length}.`);
        }

        refreshVisibleTopicPresence().catch(function (error) {
            console.warn('topic presence refresh failed:', error);
        });
    }

    async function loadFromSupabase() {
        try {
            if (!configLoaded) {
                await loadSupabaseConfig();
            }

            setStatus("Loading from Supabase...");

            var response = await fetch(`${supabaseUrl}/rest/v1/${SUPABASE_TABLE}?select=id,author,topic,created_at&order=created_at.desc`, {
                method: "GET",
                headers: {
                    apikey: supabaseAnonKey,
                    Authorization: `Bearer ${supabaseAnonKey}`
                }
            });

            if (!response.ok) {
                var errorText = await response.text();
                throw new Error(errorText || "Supabase load failed.");
            }

            var rows = await response.json();
            allTopicRows = rows || [];
            renderTopicsFromQuery();

            if (!rows.length) {
                setStatus("No debate topics found yet.");
                return;
            }

            setStatus(`Loaded ${rows.length} topic${rows.length === 1 ? "" : "s"} from Supabase. Showing random sample.`);
        } catch (error) {
            setStatus(error instanceof Error ? error.message : "Something went wrong.");
        }
    }

    async function submitTake(event) {
        event.preventDefault();

        var author = authorTextInput.value.trim();
        var topic = takeTextInput.value.trim();

        if (!author || !topic) {
            setStatus("Add both an author and a topic first.");
            return;
        }

        try {
            if (!configLoaded) {
                await loadSupabaseConfig();
            }

            setStatus("Saving to Supabase...");

            var response = await fetch(`${supabaseUrl}/rest/v1/${SUPABASE_TABLE}`, {
                method: "POST",
                headers: {
                    apikey: supabaseAnonKey,
                    Authorization: `Bearer ${supabaseAnonKey}`,
                    "Content-Type": "application/json",
                    Prefer: "return=representation"
                },
                body: JSON.stringify({ author: author, topic: topic })
            });

            if (!response.ok) {
                var errorText = await response.text();
                throw new Error(errorText || "Supabase insert failed.");
            }

            await loadFromSupabase();
            authorTextInput.value = "";
            takeTextInput.value = "";
            setStatus("Saved to Supabase.");
        } catch (error) {
            setStatus(error instanceof Error ? error.message : "Something went wrong.");
        }
    }

    async function upsertHomePresence() {
        if (!configLoaded) {
            return;
        }

        var payload = {
            topic: HOME_TOPIC_KEY,
            session_id: homeSessionId,
            display_name: authorTextInput.value.trim() || null,
            last_seen: new Date().toISOString()
        };

        var response = await fetch(`${supabaseUrl}/rest/v1/${SUPABASE_TABLE_PRESENCE}?on_conflict=topic,session_id`, {
            method: "POST",
            headers: {
                apikey: supabaseAnonKey,
                Authorization: `Bearer ${supabaseAnonKey}`,
                "Content-Type": "application/json",
                Prefer: "resolution=merge-duplicates,return=representation"
            },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            throw new Error(await response.text());
        }
    }

    async function refreshHomePresence() {
        if (!configLoaded) {
            setHomePresence("0 people are online right now");
            return;
        }

        var cutoff = new Date(Date.now() - 30000).toISOString();
        var url = `${supabaseUrl}/rest/v1/${SUPABASE_TABLE_PRESENCE}?select=session_id&topic=eq.${encodeURIComponent(HOME_TOPIC_KEY)}&last_seen=gte.${encodeURIComponent(cutoff)}`;

        var response = await fetch(url, {
            method: "GET",
            headers: {
                apikey: supabaseAnonKey,
                Authorization: `Bearer ${supabaseAnonKey}`
            }
        });

        if (!response.ok) {
            throw new Error(await response.text());
        }

        var rows = JSON.parse(await response.text() || "[]");
        setHomePresence(`${rows.length} ${rows.length === 1 ? "person is" : "people are"} online right now`);
    }

    function startHomePresenceTracking() {
        upsertHomePresence().catch(function (error) {
            console.warn("home presence heartbeat failed:", error);
        });

        refreshHomePresence().catch(function (error) {
            console.warn("home presence refresh failed:", error);
        });

        if (homePresenceHeartbeatId) {
            clearInterval(homePresenceHeartbeatId);
        }

        if (homePresenceRefreshId) {
            clearInterval(homePresenceRefreshId);
        }

        if (visibleTopicPresenceRefreshId) {
            clearInterval(visibleTopicPresenceRefreshId);
        }

        homePresenceHeartbeatId = setInterval(function () {
            upsertHomePresence().catch(function (error) {
                console.warn("home presence heartbeat failed:", error);
            });
        }, 10000);

        homePresenceRefreshId = setInterval(function () {
            refreshHomePresence().catch(function (error) {
                console.warn("home presence refresh failed:", error);
            });
        }, 5000);

        visibleTopicPresenceRefreshId = setInterval(function () {
            refreshVisibleTopicPresence().catch(function (error) {
                console.warn("topic presence refresh failed:", error);
            });
        }, 5000);
    }

    takeForm.addEventListener("submit", submitTake);
    if (topicSearchInput) {
        topicSearchInput.addEventListener('input', function () {
            renderTopicsFromQuery();
        });
    }

    // keep homepage author field in sync with cookie
    (function(){
        const saved = (document.cookie.split('; ').find(e=>e.startsWith('debateName='))||'').split('=')[1];
        if (saved) {
            try { authorTextInput.value = decodeURIComponent(saved); } catch(e){}
        }
        authorTextInput.addEventListener('input', function(){ setCookie('debateName', authorTextInput.value, 365); });
    })();

    loadSupabaseConfig().then(loadFromSupabase).catch(function (error) {
        setStatus(error instanceof Error ? error.message : "Something went wrong.");
    });

    loadSupabaseConfig().then(startHomePresenceTracking).catch(function (error) {
        console.warn("home presence init failed:", error);
    });
</script>
</html>
