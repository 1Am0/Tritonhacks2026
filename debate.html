<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debate Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./arena.css">
</head>
<body>

    <!-- Join Modal -->
    <div id="joinModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="joinModalTitle">
        <div class="modal-card">
            <h2 id="joinModalTitle">Join the Debate</h2>
            <p class="modal-subtitle" id="joinModalTopic"></p>
            <form id="joinForm">
                <div class="modal-field">
                    <label for="joinName">Your Name</label>
                    <input id="joinName" type="text" placeholder="Enter your name" autocomplete="off" required />
                </div>
                <div class="modal-field">
                    <label>Pick a Side</label>
                    <div class="stance-buttons">
                        <button type="button" class="stance-btn" data-stance="agree">Agree</button>
                        <button type="button" class="stance-btn" data-stance="disagree">Disagree</button>
                    </div>
                    <input type="hidden" id="joinStance" required />
                </div>
                <button class="modal-submit" type="submit" id="joinSubmit" disabled>Enter Arena</button>
            </form>
        </div>
    </div>

    <h1>Debate Arena</h1>
    <h2 id="topicDisplay"></h2>
    <div id="debaterCams">
        <div class="cam">
            <label>Debater 1</label>
            <div class="cam-placeholder" aria-label="Debater 1 placeholder">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" aria-hidden="true">
                    <circle cx="40" cy="30" r="16" fill="rgba(59,130,246,0.25)" stroke="rgba(59,130,246,0.5)" stroke-width="1.5"/>
                    <ellipse cx="40" cy="68" rx="26" ry="14" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.35)" stroke-width="1.5"/>
                </svg>
                <span>Waiting for debater</span>
            </div>
        </div>
        <div class="cam">
            <label>Debater 2</label>
            <div class="cam-placeholder" aria-label="Debater 2 placeholder">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" aria-hidden="true">
                    <circle cx="40" cy="30" r="16" fill="rgba(34,211,238,0.2)" stroke="rgba(34,211,238,0.45)" stroke-width="1.5"/>
                    <ellipse cx="40" cy="68" rx="26" ry="14" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.3)" stroke-width="1.5"/>
                </svg>
                <span>Waiting for debater</span>
            </div>
        </div>
    </div>

    <section id="chatSection" class="chat-section">
        <h3>Live Chat</h3>
        <div id="topicStats">
            <span><strong id="onlineCount">0</strong> online now</span>
            <span>Last message: <strong id="lastMessageTime">No messages yet</strong></span>
        </div>
        <div class="chat-layout">
            <div class="chat-main">
                <div id="messages"></div>
                <form id="messageForm">
                    <input id="authorInput" class="message-form-input" type="text" placeholder="Your name" required style="width:25%;margin-right:8px;" />
                    <select id="stanceInput" class="message-form-select" required style="width:18%;margin-right:8px;">
                        <option value="" selected disabled>Pick a side</option>
                        <option value="agree">Agree</option>
                        <option value="disagree">Disagree</option>
                    </select>
                    <input id="messageInput" class="message-form-input" type="text" placeholder="Write a message" required style="width:55%;margin-right:8px;" />
                    <button id="sendMessage" class="message-form-button" type="submit">Send</button>
                </form>
                <p id="chatStatus" aria-live="polite"></p>
            </div>
            <aside id="aiPanel" class="ai-panel">
                <div class="ai-panel-header">
                    <strong>AI Debate Readout</strong>
                    <button id="requestAiReview" class="message-form-button" type="button">Request AI Review</button>
                </div>
                <div id="aiAvailability" class="ai-meta">Waiting for 10 messages...</div>
                <div id="aiStatus" class="ai-status">No analysis yet.</div>
                <div id="aiSummary" class="ai-summary">No analysis yet.</div>
                <div id="aiWinner" class="ai-winner"></div>
                <ul id="aiParticipants" class="ai-participants"></ul>
            </aside>
        </div>
    </section>
</body>
<script src="./supabase-config.js"></script>
<!-- Supabase JS (UMD) for realtime subscriptions -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
    const topicDisplay = document.getElementById("topicDisplay");
    const onlineCountEl = document.getElementById("onlineCount");
    const lastMessageTimeEl = document.getElementById("lastMessageTime");
    const aiStatusEl = document.getElementById("aiStatus");
    const aiSummaryEl = document.getElementById("aiSummary");
    const aiWinnerEl = document.getElementById("aiWinner");
    const aiParticipantsEl = document.getElementById("aiParticipants");
    const requestAiReviewButton = document.getElementById("requestAiReview");
    const aiAvailabilityEl = document.getElementById("aiAvailability");
    const messagesEl = document.getElementById("messages");
    const messageForm = document.getElementById("messageForm");
    const authorInput = document.getElementById("authorInput");
    const stanceInput = document.getElementById("stanceInput");
    const messageInput = document.getElementById("messageInput");
    const chatStatus = document.getElementById("chatStatus");

    function getCookie(name) {
        const cookieValue = document.cookie
            .split("; ")
            .find((entry) => entry.startsWith(`${name}=`));

        return cookieValue ? decodeURIComponent(cookieValue.slice(name.length + 1)) : "";
    }

    const debateTopic = getCookie("debateTopic");
    const topicKey = debateTopic || "no-topic";
    topicDisplay.textContent = debateTopic
        ? `Debate Topic Is: ${debateTopic}`
        : "Debate Topic Is: No topic selected";

    // Supabase REST setup (mirrors index.html approach)
    const SUPABASE_TABLE_MESSAGES = "debate_messages";
    const SUPABASE_TABLE_PRESENCE = "debate_topic_presence";
    const SUPABASE_TABLE_AI_RESULTS = "debate_ai_results";
    const SUPABASE_TABLE_AI_REQUESTS = "debate_ai_requests";
    const AI_REVIEW_INTERVAL = 10;
    const SUPABASE_ENV = window.SUPABASE_ENV || {};
    let supabaseUrl = "";
    let supabaseAnonKey = "";
    let groqApiKey = "";
    let groqApiUrl = "";
    let groqModel = 'llama-3.3-70b-versatile';
    let configLoaded = false;
    let sessionId = getSessionId();
    let presenceHeartbeatId = null;
    let presenceRefreshId = null;
    let aiReviewRequestChannel = null;

    async function loadSupabaseConfig() {
        var envConfig = SUPABASE_ENV;
        supabaseUrl = envConfig.SUPABASE_URL || envConfig.NEXT_PUBLIC_SUPABASE_URL || "";
        supabaseAnonKey = envConfig.SUPABASE_ANON_KEY || envConfig.NEXT_PUBLIC_SUPABASE_ANON_KEY || "";
        groqApiKey = envConfig.GROQ_API_KEY || envConfig.NEXT_PUBLIC_GROQ_API_KEY || "";
        groqApiUrl = envConfig.GROQ_API_URL || envConfig.NEXT_PUBLIC_GROQ_API_URL || "";
        groqModel = envConfig.GROQ_MODEL || envConfig.NEXT_PUBLIC_GROQ_MODEL || groqModel;

        if (!supabaseUrl || !supabaseAnonKey || !groqApiKey || !groqApiUrl) {
            throw new Error("Supabase config is missing GROQ config in supabase-config.js.");
        }

        configLoaded = true;
    }

    function setChatStatus(msg) {
        chatStatus.textContent = msg;
    }

    function getSessionId() {
        const storageKey = "debate-session-id";
        let existing = window.sessionStorage.getItem(storageKey);

        if (!existing) {
            existing = (window.crypto && window.crypto.randomUUID)
                ? window.crypto.randomUUID()
                : `sess-${Math.random().toString(36).slice(2)}-${Date.now()}`;
            window.sessionStorage.setItem(storageKey, existing);
        }

        return existing;
    }

    function getSelectedStance() {
        const stance = stanceInput.value;
        return stance === 'agree' || stance === 'disagree' ? stance : null;
    }

    function appendMessage(author, text, createdAt, messageSessionId, messageId) {
        if (messageId && messageIds.has(messageId)) {
            return false;
        }

        if (messageId) {
            messageIds.add(messageId);
        }

        const wrapper = document.createElement('div');
        const isOwnMessage = messageSessionId && messageSessionId === sessionId;
        wrapper.className = 'message' + (isOwnMessage ? ' own' : '');

        const authorHtml = `<strong>${author || 'Anon'}</strong>${isOwnMessage ? ' <span style="font-size:0.75rem;color:#2e7d32;">(you)</span>' : ''}`;
        const timeHtml = `<span class="meta">${createdAt ? new Date(createdAt).toLocaleTimeString() : ''}</span>`;
        wrapper.innerHTML = `${authorHtml}: ${escapeHtml(text)} ${timeHtml}`;
        messagesEl.appendChild(wrapper);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return true;
    }

    function setAiStatus(text) {
        const aiStatusEl = document.getElementById('aiStatus');
        if (aiStatusEl) {
            aiStatusEl.textContent = text;
        }
    }

    function getReviewAvailabilityText(messageCount, lastReviewCount) {
        if (messageCount < AI_REVIEW_INTERVAL) {
            return `Available after ${AI_REVIEW_INTERVAL} messages.`;
        }

        if (!lastReviewCount) {
            return `Review available now.`;
        }

        const nextAllowed = lastReviewCount + AI_REVIEW_INTERVAL;
        if (messageCount < nextAllowed) {
            return `Review already requested at ${lastReviewCount} messages. Next request opens at ${nextAllowed}.`;
        }

        return `Review available now (last review at ${lastReviewCount}).`;
    }

    function setReviewButtonState(messageCount, lastReviewCount) {
        if (!requestAiReviewButton || !aiAvailabilityEl) {
            return;
        }

        const isAvailableNow = messageCount >= AI_REVIEW_INTERVAL && (!lastReviewCount || messageCount - lastReviewCount >= AI_REVIEW_INTERVAL);
        requestAiReviewButton.disabled = !isAvailableNow || aiAnalysisInFlight;
        requestAiReviewButton.textContent = isAvailableNow ? 'Request AI Review' : 'AI Review Locked';
        aiAvailabilityEl.textContent = getReviewAvailabilityText(messageCount, lastReviewCount);
    }

    async function fetchAiRequestLock(messageCount) {
        if (!debateTopic || messageCount < AI_REVIEW_INTERVAL) {
            return null;
        }

        const url = `${supabaseUrl}/rest/v1/${SUPABASE_TABLE_AI_REQUESTS}?select=topic,message_count,requested_by_session_id,requested_at&topic=eq.${encodeURIComponent(debateTopic)}&order=message_count.desc&limit=1`;
        const res = await fetch(url, {
            method: 'GET',
            headers: {
                apikey: supabaseAnonKey,
                Authorization: `Bearer ${supabaseAnonKey}`
            }
        });

        if (!res.ok) {
            throw new Error(await res.text());
        }

        const rows = JSON.parse(await res.text() || '[]');
        return rows[0] || null;
    }

    async function refreshAiReviewControls() {
        if (!configLoaded || !debateTopic) {
            if (aiAvailabilityEl) {
                aiAvailabilityEl.textContent = 'No topic selected.';
            }
            return;
        }

        const currentCount = allMessages.length;
        try {
            const lock = await fetchAiRequestLock(currentCount).catch(() => null);
            setReviewButtonState(currentCount, lock ? Number(lock.message_count || 0) : 0);
        } catch (err) {
            console.warn('review controls refresh failed:', err);
            setReviewButtonState(currentCount, 0);
        }
    }

    function renderAiResult(result) {
        const aiSummaryEl = document.getElementById('aiSummary');
        const aiWinnerEl = document.getElementById('aiWinner');
        const aiParticipantsEl = document.getElementById('aiParticipants');

        if (!aiSummaryEl || !aiWinnerEl || !aiParticipantsEl) {
            return;
        }

        if (!result) {
            aiSummaryEl.textContent = 'No analysis yet.';
            aiWinnerEl.textContent = '';
            aiParticipantsEl.innerHTML = '';
            return;
        }

        latestAiResult = result;
        aiSummaryEl.textContent = result.summary || 'AI analysis complete.';
        aiWinnerEl.textContent = result.winner_display_name
            ? `Current winner: ${result.winner_display_name}`
            : 'Current winner: pending';
        aiParticipantsEl.innerHTML = '';

        (result.participants || []).forEach((participant) => {
            const item = document.createElement('li');
            item.textContent = `${participant.display_name || participant.session_id}: ${participant.moved_percentage}% moved (${participant.stance || 'unknown'})`;
            aiParticipantsEl.appendChild(item);
        });
    }

    function updateLastMessageLabel(rows) {
        if (!rows.length) {
            lastMessageTimeEl.textContent = 'No messages yet';
            return;
        }

        const lastRow = rows[rows.length - 1];
        lastMessageTimeEl.textContent = new Date(lastRow.created_at).toLocaleString();
    }

    function updateOnlineCountLabel(count) {
        onlineCountEl.textContent = String(count);
    }

    function escapeHtml(unsafe) {
        return unsafe
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function extractGroqContent(responseJson) {
        // Groq response shapes vary; attempt to pull assistant text similarly to chat models.
        const choice = responseJson && responseJson.choices && responseJson.choices[0] ? responseJson.choices[0] : null;
        return choice && choice.message && typeof choice.message.content === 'string' ? choice.message.content : JSON.stringify(responseJson);
    }

    function stripCodeFences(text) {
        if (!text || typeof text !== 'string') return text;
        // Remove fenced code blocks (```json ... ``` or ``` ... ```) and trim
        return text.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim();
    }

    async function fetchAiResultCache() {
        const url = `${supabaseUrl}/rest/v1/${SUPABASE_TABLE_AI_RESULTS}?select=topic,analyzed_message_count,result,updated_at&topic=eq.${encodeURIComponent(debateTopic)}&limit=1`;
        const res = await fetch(url, {
            method: 'GET',
            headers: {
                apikey: supabaseAnonKey,
                Authorization: `Bearer ${supabaseAnonKey}`
            }
        });

        if (!res.ok) {
            throw new Error(await res.text());
        }

        const rows = JSON.parse(await res.text() || '[]');
        return rows[0] || null;
    }

    async function upsertAiResult(result, analyzedMessageCount) {
        const payload = {
            topic: debateTopic,
            analyzed_message_count: analyzedMessageCount,
            result,
            updated_at: new Date().toISOString()
        };

        const res = await fetch(`${supabaseUrl}/rest/v1/${SUPABASE_TABLE_AI_RESULTS}?on_conflict=topic`, {
            method: 'POST',
            headers: {
                apikey: supabaseAnonKey,
                Authorization: `Bearer ${supabaseAnonKey}`,
                'Content-Type': 'application/json',
                Prefer: 'resolution=merge-duplicates,return=representation'
            },
            body: JSON.stringify(payload)
        });

        if (!res.ok) {
            throw new Error(await res.text());
        }

        return JSON.parse(await res.text() || '[]')[0] || null;
    }

    async function fetchAiParticipants() {
        const url = `${supabaseUrl}/rest/v1/${SUPABASE_TABLE_PRESENCE}?select=session_id,display_name,stance&topic=eq.${encodeURIComponent(debateTopic)}`;
        const res = await fetch(url, {
            method: 'GET',
            headers: {
                apikey: supabaseAnonKey,
                Authorization: `Bearer ${supabaseAnonKey}`
            }
        });

        if (!res.ok) {
            throw new Error(await res.text());
        }

        return JSON.parse(await res.text() || '[]');
    }

    async function analyzeReviewSnapshot(reviewCount, recentMessages) {
        if (aiAnalysisInFlight || !debateTopic || !groqApiKey || !groqApiUrl) {
            return;
        }

        aiAnalysisInFlight = true;
        setAiStatus(`Analyzing review at message #${reviewCount}...`);

        try {
            const cache = await fetchAiResultCache().catch(() => null);
            if (cache && Number(cache.analyzed_message_count || 0) >= reviewCount) {
                lastAnalyzedMessageCount = Number(cache.analyzed_message_count || 0);
                renderAiResult(cache.result);
                setAiStatus(`Showing cached analysis for ${lastAnalyzedMessageCount} messages.`);
                return;
            }

                const snapshotMessages = recentMessages || allMessages.slice(-10);
                const [participants, latestMessages] = await Promise.all([
                    fetchAiParticipants(),
                    Promise.resolve(snapshotMessages),
                ]);

            const prompt = `You are scoring a live debate.\nTopic: ${debateTopic}\n\nParticipants:\n${JSON.stringify(participants, null, 2)}\n\nLast 10 messages only:\n${JSON.stringify(recentMessages, null, 2)}\n\nTask:\n- For each participant, estimate how persuaded they appear to be by the opposing side.\n- Return a percentage from 0 to 100 for each participant, where 0 = not moved at all and 100 = fully moved.\n- Use the participant's explicit stance if present. If stance is missing, infer it from the conversation.\n- Identify the current winner as the participant whose arguments appear to be persuading others the most.\n- Return JSON only in this shape:\n{\n  \"topic\": \"...\",\n  \"winner_session_id\": \"...\",\n  \"winner_display_name\": \"...\",\n  \"summary\": \"...\",\n  \"participants\": [\n    {\n      \"session_id\": \"...\",\n      \"display_name\": \"...\",\n      \"stance\": \"agree|disagree|null\",\n      \"moved_percentage\": 0,\n      \"reason\": \"...\"\n    }\n  ]\n}\n`;

            const endpoint = `${groqApiUrl.replace(/\/+$/, '')}/chat/completions`;
            const aiResponse = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    Authorization: `Bearer ${groqApiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ model: groqModel, messages: [{ role: 'user', content: prompt }], temperature: 0.2 })
            });

            const aiBody = await aiResponse.text();
            if (!aiResponse.ok) {
                throw new Error(aiBody || 'GROQ request failed');
            }

            const raw = extractGroqContent(JSON.parse(aiBody)) || '';
            const cleaned = stripCodeFences(raw);
            const parsed = JSON.parse(cleaned || '{}');
            const saved = await upsertAiResult(parsed, reviewCount);
            lastAnalyzedMessageCount = reviewCount;
            renderAiResult(saved ? saved.result : parsed);
            setAiStatus(`Analyzed review at message #${reviewCount}.`);
        } catch (err) {
            console.warn('AI analysis failed:', err);
            setAiStatus(err instanceof Error ? err.message : String(err));
        } finally {
            aiAnalysisInFlight = false;
            refreshAiReviewControls().catch(() => {});
        }
    }

    async function requestAiReview() {
        if (!configLoaded || !debateTopic) {
            return;
        }

        const currentCount = allMessages.length;
        const lock = await fetchAiRequestLock(currentCount).catch(() => null);
        const lastReviewCount = lock ? Number(lock.message_count || 0) : 0;

        if (currentCount < AI_REVIEW_INTERVAL) {
            setAiStatus(`Wait until ${AI_REVIEW_INTERVAL} messages before requesting a review.`);
            await refreshAiReviewControls();
            return;
        }

        if (lastReviewCount && currentCount - lastReviewCount < AI_REVIEW_INTERVAL) {
            setAiStatus(`Review already requested at ${lastReviewCount} messages. Next request opens at ${lastReviewCount + AI_REVIEW_INTERVAL}.`);
            await refreshAiReviewControls();
            return;
        }

        const snapshot = allMessages.slice(-AI_REVIEW_INTERVAL);

        const claimRes = await fetch(`${supabaseUrl}/rest/v1/${SUPABASE_TABLE_AI_REQUESTS}`, {
            method: 'POST',
            headers: {
                apikey: supabaseAnonKey,
                Authorization: `Bearer ${supabaseAnonKey}`,
                'Content-Type': 'application/json',
                Prefer: 'return=representation'
            },
            body: JSON.stringify({
                topic: debateTopic,
                message_count: currentCount,
                requested_by_session_id: sessionId,
                requested_at: new Date().toISOString()
            })
        });

        if (!claimRes.ok) {
            const bodyText = await claimRes.text();
            if (/duplicate key|23505|conflict/i.test(bodyText)) {
                setAiStatus(`Someone already requested the review for ${currentCount} messages. Everyone waits until ${currentCount + AI_REVIEW_INTERVAL}.`);
                await refreshAiReviewControls();
                return;
            }

            throw new Error(bodyText || 'Failed to claim AI review slot');
        }

        setAiStatus(`Review requested for ${currentCount} messages. Analyzing now...`);
        await analyzeReviewSnapshot(currentCount, snapshot);
    }

    async function loadMessages() {
        try {
            if (!configLoaded) await loadSupabaseConfig();
            setChatStatus('Loading messages...');

            // Filter by topic text (stored in cookie). Use REST filter: topic=eq.'...'
            const topicFilter = debateTopic ? `&topic=eq.${encodeURIComponent(debateTopic)}` : '';
            const url = `${supabaseUrl}/rest/v1/${SUPABASE_TABLE_MESSAGES}?select=id,author,message,created_at,session_id${topicFilter}&order=created_at.asc`;
            console.log('loadMessages fetch url:', url);
            const res = await fetch(url, {
                method: 'GET',
                headers: {
                    apikey: supabaseAnonKey,
                    Authorization: `Bearer ${supabaseAnonKey}`
                }
            });
            const text = await res.text();
            console.log('loadMessages response status:', res.status, 'body:', text);
            if (!res.ok) throw new Error(text || 'Supabase load failed');

            const rows = JSON.parse(text || '[]');
            allMessages = [];
            messageIds = new Set();
            messagesEl.innerHTML = '';
            rows.forEach(r => {
                if (appendMessage(r.author, r.message, r.created_at, r.session_id, r.id)) {
                    allMessages.push(r);
                }
            });
            updateLastMessageLabel(rows);
            // track last seen timestamp for polling
            if (rows.length) {
                lastTimestamp = rows[rows.length - 1].created_at;
            }
            setChatStatus(`Loaded ${rows.length} message${rows.length===1?'':'s'}.`);
            const cachedAi = await fetchAiResultCache().catch(() => null);
            if (cachedAi && cachedAi.result) {
                lastAnalyzedMessageCount = Number(cachedAi.analyzed_message_count || 0);
                renderAiResult(cachedAi.result);
                setAiStatus(`Showing cached analysis for ${lastAnalyzedMessageCount} messages.`);
            }
            await refreshAiReviewControls();
        } catch (err) {
            setChatStatus(err instanceof Error ? err.message : String(err));
        }
    }
    let lastTimestamp = null;
    let realtimeChannel = null;
    let aiRealtimeChannel = null;
    let aiRequestRealtimeChannel = null;
    let presenceRealtimeChannel = null;
    let supabaseClient = null;
    let allMessages = [];
    let messageIds = new Set();
    let aiAnalysisInFlight = false;
    let lastAnalyzedMessageCount = 0;
    let latestAiResult = null;

    function getSupabaseClient() {
        if (supabaseClient) {
            return supabaseClient;
        }

        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
            throw new Error('Supabase client missing (CDN script not loaded)');
        }

        supabaseClient = window.__sbClient || (window.__sbClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey));
        return supabaseClient;
    }

    // Start a Supabase realtime subscription for new messages (INSERTs)
    function startRealtime() {
        try {
            if (!configLoaded) throw new Error('Supabase config not loaded');
            if (!debateTopic) throw new Error('No debate topic for realtime');

            const client = getSupabaseClient();
            if (realtimeChannel) {
                return Promise.resolve();
            }

            // Exact Supabase pattern, with message rendering inside the INSERT handler.
            const channel = client.channel('table_db_changes')
                .on(
                    'postgres_changes',
                    { event: 'INSERT', schema: 'public', table: SUPABASE_TABLE_MESSAGES },
                    (payload) => {
                        console.log('New message in DB:', payload.new);

                        const row = payload.new;
                        if (debateTopic && row.topic !== debateTopic) {
                            return;
                        }

                        if (appendMessage(row.author, row.message, row.created_at, row.session_id, row.id)) {
                            allMessages.push(row);
                            refreshAiReviewControls().catch(err => console.warn('review control refresh failed:', err));
                        }
                        lastTimestamp = row.created_at || lastTimestamp;
                        lastMessageTimeEl.textContent = row.created_at ? new Date(row.created_at).toLocaleString() : lastMessageTimeEl.textContent;
                    }
                )
                .subscribe();

            realtimeChannel = channel;

            if (!aiRealtimeChannel) {
                aiRealtimeChannel = client.channel('ai_debate_results')
                    .on(
                        'postgres_changes',
                        { event: '*', schema: 'public', table: SUPABASE_TABLE_AI_RESULTS },
                        (payload) => {
                            const row = payload.new || payload.old;
                            if (!row || row.topic !== debateTopic) {
                                return;
                            }

                            lastAnalyzedMessageCount = Number(row.analyzed_message_count || 0);
                            renderAiResult(row.result);
                            setAiStatus(`Updated live for ${lastAnalyzedMessageCount} messages.`);
                        }
                    )
                    .subscribe();
            }

            if (!aiRequestRealtimeChannel) {
                aiRequestRealtimeChannel = client.channel('ai_review_requests')
                    .on(
                        'postgres_changes',
                        { event: '*', schema: 'public', table: SUPABASE_TABLE_AI_REQUESTS },
                        (payload) => {
                            const row = payload.new || payload.old;
                            if (!row || row.topic !== debateTopic) {
                                return;
                            }

                            refreshAiReviewControls().catch(err => console.warn('review control refresh failed (realtime):', err));
                        }
                    )
                    .subscribe();
            }

            if (!presenceRealtimeChannel) {
                presenceRealtimeChannel = client.channel('presence_changes')
                    .on(
                        'postgres_changes',
                        { event: '*', schema: 'public', table: SUPABASE_TABLE_PRESENCE },
                        (payload) => {
                            try {
                                const row = payload.new || payload.old;
                                if (!row) return;
                                if (debateTopic && row.topic !== debateTopic) return;
                                // On any presence change, refresh the online count quickly
                                refreshPresenceCount().catch(err => console.warn('presence refresh failed (realtime):', err));
                            } catch (e) {
                                console.warn('presence realtime handler error', e);
                            }
                        }
                    )
                    .subscribe();
            }

            window.addEventListener('beforeunload', () => {
                try { if (realtimeChannel) realtimeChannel.unsubscribe(); } catch (e) {}
                try { if (aiRealtimeChannel) aiRealtimeChannel.unsubscribe(); } catch (e) {}
                try { if (aiRequestRealtimeChannel) aiRequestRealtimeChannel.unsubscribe(); } catch (e) {}
            });

            return Promise.resolve();
        } catch (err) {
            return Promise.reject(err);
        }
    }

    if (requestAiReviewButton) {
        requestAiReviewButton.addEventListener('click', () => {
            requestAiReview().catch(err => {
                console.warn('AI review request failed:', err);
                setAiStatus(err instanceof Error ? err.message : String(err));
            });
        });
    }

    async function upsertPresence() {
        if (!configLoaded || !debateTopic) {
            return;
        }

        const payload = {
            topic: debateTopic,
            session_id: sessionId,
            display_name: authorInput.value.trim() || null,
            stance: getSelectedStance(),
            last_seen: new Date().toISOString()
        };

        const res = await fetch(`${supabaseUrl}/rest/v1/${SUPABASE_TABLE_PRESENCE}?on_conflict=topic,session_id`, {
            method: 'POST',
            headers: {
                apikey: supabaseAnonKey,
                Authorization: `Bearer ${supabaseAnonKey}`,
                'Content-Type': 'application/json',
                Prefer: 'resolution=merge-duplicates,return=representation'
            },
            body: JSON.stringify(payload)
        });

        if (!res.ok) {
            throw new Error(await res.text());
        }
    }

    async function refreshPresenceCount() {
        if (!configLoaded || !debateTopic) {
            updateOnlineCountLabel(0);
            return;
        }

        const cutoff = new Date(Date.now() - 30000).toISOString();
        const topicFilter = `topic=eq.${encodeURIComponent(debateTopic)}&last_seen=gte.${encodeURIComponent(cutoff)}`;
        const url = `${supabaseUrl}/rest/v1/${SUPABASE_TABLE_PRESENCE}?select=session_id&${topicFilter}`;

        const res = await fetch(url, {
            method: 'GET',
            headers: {
                apikey: supabaseAnonKey,
                Authorization: `Bearer ${supabaseAnonKey}`
            }
        });

        if (!res.ok) {
            throw new Error(await res.text());
        }

        const rows = JSON.parse(await res.text() || '[]');
        updateOnlineCountLabel(rows.length);
    }

    function startPresenceTracking() {
        if (!debateTopic) {
            updateOnlineCountLabel(0);
            return;
        }

        upsertPresence().catch(err => console.warn('presence heartbeat failed:', err));
        refreshPresenceCount().catch(err => console.warn('presence refresh failed:', err));

        if (presenceHeartbeatId) clearInterval(presenceHeartbeatId);
        if (presenceRefreshId) clearInterval(presenceRefreshId);

        presenceHeartbeatId = setInterval(() => {
            upsertPresence().catch(err => console.warn('presence heartbeat failed:', err));
        }, 10000);

        presenceRefreshId = setInterval(() => {
            refreshPresenceCount().catch(err => console.warn('presence refresh failed:', err));
        }, 5000);

        stanceInput.addEventListener('change', () => {
            upsertPresence().catch(err => console.warn('presence update after stance change failed:', err));
        });

        window.addEventListener('beforeunload', () => {
            if (!configLoaded || !debateTopic) {
                return;
            }

            const url = `${supabaseUrl}/rest/v1/${SUPABASE_TABLE_PRESENCE}?topic=eq.${encodeURIComponent(debateTopic)}&session_id=eq.${encodeURIComponent(sessionId)}`;
            navigator.sendBeacon?.(url, new Blob([], { type: 'application/json' }));
        });
    }

    async function sendMessage(e) {
        e.preventDefault();
        const author = authorInput.value.trim();
        const message = messageInput.value.trim();
        const stance = getSelectedStance();
        if (!message) return;
        if (!stance) {
            setChatStatus('Pick agree or disagree before sending your message.');
            return;
        }
        try {
            if (!configLoaded) await loadSupabaseConfig();
            setChatStatus('Sending...');

            // Try to include session_id. If the DB/schema doesn't have that column yet
            // PostgREST may return an error like "Could not find the 'session_id' column".
            // In that case retry the insert without session_id so sending still works.
            const url = `${supabaseUrl}/rest/v1/${SUPABASE_TABLE_MESSAGES}`;
            const baseHeaders = {
                apikey: supabaseAnonKey,
                Authorization: `Bearer ${supabaseAnonKey}`,
                'Content-Type': 'application/json',
                Prefer: 'return=representation'
            };

            let payload = { author: author || null, message: message, topic: debateTopic || null, session_id: sessionId };
            let res = await fetch(url, { method: 'POST', headers: baseHeaders, body: JSON.stringify(payload) });
            if (!res.ok) {
                const bodyText = await res.text();
                console.warn('sendMessage initial POST failed:', res.status, bodyText);
                // If failure mentions missing session_id column, retry without it
                if (/session_id|Could not find the 'session_id' column/i.test(bodyText)) {
                    payload = { author: author || null, message: message, topic: debateTopic || null };
                    res = await fetch(url, { method: 'POST', headers: baseHeaders, body: JSON.stringify(payload) });
                    if (!res.ok) throw new Error(await res.text());
                } else {
                    throw new Error(bodyText || 'Supabase insert failed');
                }
            }

            await refreshPresenceCount();
            messageInput.value = '';
            setChatStatus('Sent.');
        } catch (err) {
            setChatStatus(err instanceof Error ? err.message : String(err));
        }
    }

    messageForm.addEventListener('submit', sendMessage);

    // initial load: messages -> realtime subscribe
    loadSupabaseConfig().then(function(){
        loadMessages().then(function(){
            startRealtime().then(() => {
                startPresenceTracking();
            }).catch((err) => {
                console.warn('Realtime unavailable:', err);
                startPresenceTracking();
            });
        });
    }).catch(err => setChatStatus(err instanceof Error?err.message:String(err)));
</script>
